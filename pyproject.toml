[project]
name = "sequential-music-recommendation"
version = "0.1.0"
description = "Leveraging Negative Signals with Self-Attention for Sequential Music Recommendation (MuRS @ RecSys 2023)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pytorch-lightning",
    "torch",
    "torchvision",
    "torchaudio",
    "torchmetrics",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "tqdm",
    "wandb",
]

[tool.uv]
package = false

# RTX 5090 (Blackwell, sm_120) needs CUDA 12.8 torch wheels.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
